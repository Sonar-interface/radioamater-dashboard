name: Osvježi radioamaterske podatke

on:
  schedule:
    - cron: "*/10 * * * *"     # GitHub može kasniti nekoliko minuta
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: izvori
  cancel-in-progress: false

jobs:
  osvjezi:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaliraj pakete
        run: pip install meshtastic paho-mqtt cryptography

      - name: Dohvati podatke (PSKReporter, solar, DX, METAR, Meshtastic, repetitori, sateliti)
        run: |
          # zapis traje ~9 min; čvorovi se spajaju s prethodnim data/live.json
          timeout 540 python izvori.py --minutes 9 || true

      - name: Spremi podatke ako su se promijenili
        run: |
          git config user.name "izvori-bot"
          git config user.email "izvori-bot@users.noreply.github.com"
          rm -f data/*.tmp
          git add data
          if git diff --cached --quiet; then
            echo "Nema promjena"
          else
            git commit -m "Osvježi podatke $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs origin main || true
            git push
          fi
